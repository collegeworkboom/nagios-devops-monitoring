# EXAMPLE: HTTP endpoint and replica health for nginx-demo.
# Address/port must be reachable from the Nagios server. Lab HTTP port used: 8082.
define host {
    use                     linux-server
    host_name               kubernetes-nginx
    alias                   Kubernetes Nginx Deployment
    address                 192.168.56.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               kubernetes-nginx
    service_description     Kubernetes Nginx HTTP
    check_command           check_http_custom_port!8082
}

# Requires check_k8s_health to be defined and allowed by NSClient++/NRPE.
# Verify this remotely before enabling in a production dashboard.
define service {
    use                     generic-service
    host_name               kubernetes-nginx
    service_description     Kubernetes Pod Health
    check_command           check_k8s_health
}
