# EXAMPLE: replace address and adapt database check to your installed plugin.
define host {
    use                     linux-server
    host_name               linux-db-server
    alias                   Linux Database Server
    address                 192.168.56.11
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               linux-db-server
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

