# Example command definitions. Confirm plugin locations on your Nagios server.
# The check_nrpe command may already exist in your installation; avoid duplicates.
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

define command {
    command_name    check_http_custom_port
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$
}

define command {
    command_name    check_k8s_health
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_k8s_health
}
